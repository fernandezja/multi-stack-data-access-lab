name: jedi-data-access
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: StarwarsAcademy
      MARIADB_USER: ${DB_APP_USER}
      MARIADB_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:3307:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  api-ts:
    build: ./api-ts
    environment:
      DATABASE_URL: mysql://${DB_APP_USER}:${DB_APP_PASSWORD}@mariadb:3306/StarwarsAcademy
      PORT: 3001
    ports: ["127.0.0.1:3001:3001"]
    depends_on: { mariadb: { condition: service_healthy } }
  api-net:
    build: ./api-net
    environment:
      ConnectionStrings__StarwarsAcademy: Server=mariadb;Port=3306;Database=StarwarsAcademy;User=${DB_APP_USER};Password=${DB_APP_PASSWORD};
      ASPNETCORE_URLS: http://0.0.0.0:8080
    ports: ["127.0.0.1:3002:8080"]
    depends_on: { mariadb: { condition: service_healthy } }
  web-astro:
    build:
      context: ./web-astro
      args:
        PUBLIC_API_TS_URL: http://localhost:3001
        PUBLIC_API_NET_URL: http://localhost:3002
    ports: ["127.0.0.1:4321:80"]
    depends_on: [api-ts, api-net]
volumes: { mariadb-data: }
